name: Bug report
description: Report a reproducible problem in Hanoki.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include API keys, tokens, or personal chat data.
  - type: input
    id: version
    attributes:
      label: Hanoki version
      placeholder: v0.0.16
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: operating-system-version
    attributes:
      label: Operating system version
      placeholder: macOS 26.0, Windows 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove secrets and personal data before pasting logs.
      render: shell
