name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-release:
    environment: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"

          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Expected tag ${EXPECTED_TAG}, got ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    needs: create-release
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: linux-binaries
          - os: windows-2022
            artifact_name: windows-binaries
          - os: macos-26
            artifact_name: macos-binaries
    runs-on: ${{ matrix.os }}
    # `secrets` cannot be read from a step `if`, so surface the one that gates
    # signing as an env flag. Without it the macOS build still succeeds, just
    # ad-hoc signed as before.
    env:
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10.14.0
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Import the Developer ID certificate into a throwaway keychain rather
      # than the runner's login keychain, and hand the App Store Connect API key
      # to notarytool as a file. Both live under RUNNER_TEMP, which GitHub wipes
      # when the ephemeral runner is torn down.
      - name: Set up Apple signing
        if: runner.os == 'macOS' && env.APPLE_SIGNING_ENABLED == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERTIFICATE_PATH="${RUNNER_TEMP}/certificate.p12"
          API_KEY_PATH="${RUNNER_TEMP}/apple-api-key.p8"

          printf '%s' "${APPLE_CERTIFICATE_P12}" | base64 --decode > "${CERTIFICATE_PATH}"
          printf '%s' "${APPLE_API_KEY_P8}" | base64 --decode > "${API_KEY_PATH}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          # Without this the keychain re-locks after five minutes of idling and
          # notarization waits are comfortably longer than that.
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${APPLE_CERTIFICATE_PASSWORD}" \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}" \
            -T /usr/bin/codesign
          # Stops codesign from blocking on a GUI "allow access" prompt.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}" > /dev/null
          security list-keychain -d user -s "${KEYCHAIN_PATH}" login.keychain-db

          rm -f "${CERTIFICATE_PATH}"

          echo "APPLE_KEYCHAIN=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"
          echo "APPLE_API_KEY=${API_KEY_PATH}" >> "${GITHUB_ENV}"

          # `find-identity` exits 0 even when it finds nothing, so assert on the
          # output instead: a silent import failure would otherwise surface much
          # later as an opaque codesign error. Capture first rather than piping,
          # because `grep -q` can SIGPIPE `security` and trip `pipefail`.
          IDENTITIES="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          printf '%s\n' "${IDENTITIES}"

          if ! printf '%s' "${IDENTITIES}" | grep -q "Developer ID Application"; then
            echo "No valid Developer ID Application identity in the keychain" >&2
            security find-identity -p codesigning "${KEYCHAIN_PATH}" >&2
            exit 1
          fi

      - name: Publish release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm release:publish

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact_name }}
          path: out/make/**
          if-no-files-found: error
